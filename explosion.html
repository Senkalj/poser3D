<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Explosion</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; }
  #hint { position:fixed; bottom:14px; width:100%; text-align:center; color:#555;
    font:13px system-ui, sans-serif; pointer-events:none; }
</style>
</head>
<body>
<div id="hint">Click or tap to replay</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);

// ---- particle data ----
const COUNT = 6000;
const positions = new Float32Array(COUNT * 3);
const velocities = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);
const baseColors = new Float32Array(COUNT * 3);
const lifetimes = new Float32Array(COUNT);

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

// Soft round glow sprite drawn on a canvas
function makeSprite() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.25, 'rgba(255,255,255,0.8)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

const material = new THREE.PointsMaterial({
  size: 0.18,
  map: makeSprite(),
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
scene.add(new THREE.Points(geometry, material));

const tmp = new THREE.Color();
let age = 0;

function explode() {
  age = 0;
  for (let i = 0; i < COUNT; i++) {
    const i3 = i * 3;
    positions[i3] = positions[i3 + 1] = positions[i3 + 2] = 0;

    // random direction on a sphere, random speed (some fast, most slower)
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const speed = 2 + Math.pow(Math.random(), 2) * 10;
    velocities[i3]     = Math.sin(phi) * Math.cos(theta) * speed;
    velocities[i3 + 1] = Math.sin(phi) * Math.sin(theta) * speed;
    velocities[i3 + 2] = Math.cos(phi) * speed;

    // hot white-yellow core fading to orange/red
    tmp.setHSL(0.02 + Math.random() * 0.12, 1, 0.5 + Math.random() * 0.4);
    baseColors[i3] = tmp.r; baseColors[i3 + 1] = tmp.g; baseColors[i3 + 2] = tmp.b;

    lifetimes[i] = 1.2 + Math.random() * 1.8; // seconds
  }
}

const clock = new THREE.Clock();
const DRAG = 1.8;     // air resistance
const GRAVITY = -2.5; // gentle pull downward

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  age += dt;
  const damp = Math.exp(-DRAG * dt);

  for (let i = 0; i < COUNT; i++) {
    const i3 = i * 3;
    velocities[i3]     *= damp;
    velocities[i3 + 1]  = velocities[i3 + 1] * damp + GRAVITY * dt;
    velocities[i3 + 2] *= damp;
    positions[i3]     += velocities[i3] * dt;
    positions[i3 + 1] += velocities[i3 + 1] * dt;
    positions[i3 + 2] += velocities[i3 + 2] * dt;

    // fade out over lifetime (additive blending: darker = more transparent)
    const t = Math.max(0, 1 - age / lifetimes[i]);
    const f = t * t;
    colors[i3]     = baseColors[i3] * f;
    colors[i3 + 1] = baseColors[i3 + 1] * f * f; // green fades faster -> shifts to red
    colors[i3 + 2] = baseColors[i3 + 2] * f * f * f;
  }
  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('pointerdown', explode);

explode();
animate();
</script>
</body>
</html>
