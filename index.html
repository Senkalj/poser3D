<!DOCTYPE html>
<!-- Poser3D v1.0 · two-figure 3D pose reference tool · built with three.js (MIT licence) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poser3D – Two-Figure Pose Tool</title>
<meta name="description" content="Poser3D – pose two 3D mannequins (seated, standing, lying), avoid overlaps, save poses and export PNG/JPG reference images.">
<meta name="theme-color" content="#f4f1ec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='24' cy='16' r='9' fill='%23ff3a10'/%3E%3Crect x='15' y='27' width='18' height='30' rx='9' fill='%23ff3a10'/%3E%3Ccircle cx='42' cy='18' r='9' fill='%2322e000'/%3E%3Crect x='33' y='29' width='18' height='28' rx='9' fill='%2322e000'/%3E%3C/svg%3E">
<style>
  :root { --ink:#25221e; --muted:#7a736a; --panel:rgba(255,253,250,.96); --line:#e4ddd2; --accent:#25221e; --split:50dvh; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#f4f1ec; color:var(--ink);
    font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  canvas { position:fixed; left:0; top:0; display:block; width:100vw; height:100dvh; touch-action:none; }
  body.editing canvas { height:var(--split); }
  #top { position:fixed; left:0; right:0; top:0; padding:calc(10px + env(safe-area-inset-top)) 12px 8px;
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; pointer-events:none; z-index:2; }
  #top h1 { margin:0 8px 0 2px; font-size:15px; font-weight:650; letter-spacing:.01em; pointer-events:auto; }
  .chip { pointer-events:auto; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    padding:6px 11px; border-radius:999px; font:inherit; font-size:13px; cursor:pointer; backdrop-filter:blur(8px); }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:430px) { .chip { padding:5px 9px; font-size:12.5px; } #top { gap:5px; padding-left:10px; padding-right:10px; } #top h1 { font-size:14px; margin-right:4px; } }
  #panel { position:fixed; left:0; right:0; bottom:0; z-index:3; display:flex; flex-direction:column;
    background:var(--panel); backdrop-filter:blur(12px); border-top:1px solid var(--line);
    border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.06); }
  body.editing #panel { top:var(--split); border-radius:0; }
  .wrap { width:100%; max-width:600px; margin:0 auto; }
  #panelHead { flex:none; padding:8px 14px 10px; cursor:pointer; user-select:none; }
  body:not(.editing) #panelHead { padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  #panelHead .grab { width:36px; height:4px; border-radius:2px; background:#d6cfc4; margin:0 auto 8px; }
  #selName { font-weight:650; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #body { display:none; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    padding:0 14px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  body.editing #body { display:block; }
  .hint { color:var(--muted); font-size:12.5px; margin:4px 0 6px; }
  select, input[type=text] { width:100%; font:inherit; padding:8px 10px; border-radius:10px; border:1px solid var(--line);
    background:#fff; color:var(--ink); margin-bottom:8px; }
  .row { display:grid; grid-template-columns:86px 1fr 44px; align-items:center; gap:8px; margin:4px 0; }
  .row label { color:var(--muted); font-size:12.5px; }
  .row output { text-align:right; font-variant-numeric:tabular-nums; font-size:12.5px; }
  input[type=range] { width:100%; accent-color:var(--accent); height:28px; }
  .sec { font-size:12px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:14px 0 6px; }
  section { border-bottom:1px dashed var(--line); padding-bottom:10px; }
  section:last-child { border-bottom:none; }
  #moveRows { border-top:1px dashed var(--line); margin-top:6px; padding-top:4px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .btn { border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 12px; border-radius:10px;
    font:inherit; font-size:13px; cursor:pointer; }
  .btn.dark { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.warn { background:#b3261e; color:#fff; border-color:#b3261e; }
  .btn:disabled { opacity:.4; cursor:default; }
  #toast { position:fixed; left:50%; top:calc(92px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:5;
    background:var(--ink); color:#fff; padding:8px 14px; border-radius:10px; font-size:13px; opacity:0;
    transition:opacity .25s; pointer-events:none; max-width:90vw; text-align:center; }
  .xbtn { display:none; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:#fff;
    color:var(--ink); font-size:16px; line-height:1; cursor:pointer; align-items:center; justify-content:center; flex:none; }
  body.editing .xbtn { display:inline-flex; }
  body.editing #toggleTxt { display:none; }
  #collapseEdit { font-size:18px; }
  #undoEdit { font-size:19px; }
  .xbtn:disabled { opacity:.35; cursor:default; }
  #modal { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:20px;
    background:rgba(30,26,22,.38); }
  #modal.on { display:flex; }
  .card { background:#fffdfa; border-radius:16px; padding:18px 18px 14px; width:min(380px,100%);
    box-shadow:0 12px 40px rgba(0,0,0,.18); max-height:80dvh; overflow-y:auto; }
  .card h2 { font-size:17px; margin:0 0 6px; }
  .card p { color:var(--muted); margin:0 0 12px; }
  .card input[type=text] { margin:4px 0 4px; font-size:16px; }
  .mbtns { justify-content:flex-end; margin-top:12px; }
  .mbtns .btn { padding:9px 14px; }
  .mlist { display:flex; flex-direction:column; gap:6px; }
  .mitem { display:flex; justify-content:space-between; gap:10px; text-align:left; font:inherit; padding:10px 12px;
    border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .mitem span { color:var(--muted); font-size:12px; }
  .mitem.sel { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  #modalErr { color:#b3261e; font-size:12.5px; min-height:0; margin-top:6px; }
  #modalErr:empty { display:none; }
  .preview { display:block; width:100%; max-height:42dvh; object-fit:contain; border-radius:10px; border:1px solid var(--line);
    background-color:#fff; margin:2px 0 4px; }
  .preview.checker { background-image:linear-gradient(45deg,#e7e3dd 25%,transparent 25%),linear-gradient(-45deg,#e7e3dd 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#e7e3dd 75%),linear-gradient(-45deg,transparent 75%,#e7e3dd 75%);
    background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; }
  .fmt { display:flex; flex-direction:column; gap:8px; }
  .fmt button { text-align:left; font:inherit; padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .fmt b { display:block; font-size:14.5px; }
  .fmt span { color:var(--muted); font-size:12.5px; }
  .note { color:var(--muted); font-size:12.5px; margin-top:6px; }
  #copyBox { display:none; width:100%; height:90px; margin-top:8px; font:11px/1.3 ui-monospace,Menlo,monospace;
    border:1px solid var(--line); border-radius:8px; padding:6px; }
</style>

</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <h1>Poser3D</h1>
  <button class="chip pose on" data-pose="seated">Seated</button>
  <button class="chip pose" data-pose="standing">Standing</button>
  <button class="chip pose" data-pose="lying">Lying</button>
  <button class="chip" id="exportTop">⤓ Export</button>
  <div style="flex-basis:100%;height:0"></div>
  <button class="chip on" data-cam="ref">Reference</button>
  <button class="chip" data-cam="front">Front</button>
  <button class="chip" data-cam="side">Side</button>
  <button class="chip" data-cam="back">Back ¾</button>
  <button class="chip" data-cam="top">Top</button>
</div>

<div id="toast"></div>
<div id="modal" role="dialog" aria-modal="true"><div id="modalCard" class="card"></div></div>

<div id="panel">
  <div id="panelHead">
    <div class="wrap">
      <div class="grab"></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="selName">Tap a body part to pose it</span>
        <span id="toggleTxt" style="color:var(--muted);font-size:12.5px">Edit ▴</span>
        <button id="undoEdit" class="xbtn" aria-label="Undo last edit">↶</button>
        <button id="collapseEdit" class="xbtn" aria-label="Collapse panel">▾</button>
        <button id="closeEdit" class="xbtn" aria-label="Close editor">✕</button>
      </div>
    </div>
  </div>
  <div id="body">
    <div class="wrap">
      <section>
        <div class="sec">Joints</div>
        <div class="hint">Tap a limb in the 3D view, or pick a joint here</div>
        <select id="jointSel"></select>
        <div id="rotRows">
          <div class="row"><label>Bend X</label><input id="rx" type="range" min="-180" max="180" step="1"><output id="ox"></output></div>
          <div class="row"><label>Twist Y</label><input id="ry" type="range" min="-180" max="180" step="1"><output id="oy"></output></div>
          <div class="row"><label>Tilt Z</label><input id="rz" type="range" min="-180" max="180" step="1"><output id="oz"></output></div>
        </div>
        <div id="moveRows">
          <div class="row"><label>Move X</label><input id="px" type="range" min="-100" max="100" step="1"><output id="opx"></output></div>
          <div class="row"><label>Move Y</label><input id="py" type="range" min="0" max="160" step="1"><output id="opy"></output></div>
          <div class="row"><label>Move Z</label><input id="pz" type="range" min="-100" max="100" step="1"><output id="opz"></output></div>
        </div>
        <div class="btns">
          <button class="btn" id="resetJoint">Reset joint</button>
          <button class="btn" id="resetAll">Reset pose</button>
          <button class="btn" id="fixOverlaps">Fix overlaps</button>
        </div>
      </section>

      <section>
        <div class="sec">Saved poses</div>
        <select id="savedSel"><option value="">— Choose a saved pose —</option></select>
        <input type="text" id="poseNameInp" maxlength="60" placeholder="Pose name" autocomplete="off">
        <div class="btns" style="margin-top:0">
          <button class="btn dark" id="saveNew">Save as new</button>
          <button class="btn" id="saveOver" disabled>Overwrite selected</button>
          <button class="btn" id="delSaved" disabled>Delete</button>
        </div>
        <div class="hint" id="saveStatus">Loading saved poses…</div>
      </section>

      <section>
        <div class="sec">Figure size</div>
        <div class="row"><label>Red height</label><input id="h_red" type="range" min="80" max="120" step="1" value="100"><output id="oh_red">100%</output></div>
        <div class="row"><label>Red build</label><input id="b_red" type="range" min="80" max="130" step="1" value="100"><output id="ob_red">100%</output></div>
        <div class="row"><label>Green height</label><input id="h_green" type="range" min="80" max="120" step="1" value="100"><output id="oh_green">100%</output></div>
        <div class="row"><label>Green build</label><input id="b_green" type="range" min="80" max="130" step="1" value="100"><output id="ob_green">100%</output></div>
      </section>

      <section>
        <div class="sec">View &amp; export</div>
        <div class="btns" style="margin-top:0">
          <button class="btn" id="toggleRed">Hide red</button>
          <button class="btn" id="toggleGreen">Hide green</button>
          <button class="btn" id="toggleGaze">Hide gaze lines</button>
          <button class="btn" id="toggleColl">Collisions: on</button>
          <button class="btn dark" id="exportBtn">Export image</button>
          <button class="btn" id="copyPose">Copy pose data</button>
        </div>
        <textarea id="copyBox" readonly></textarea>
      </section>
    </div>
  </div>
</div>
